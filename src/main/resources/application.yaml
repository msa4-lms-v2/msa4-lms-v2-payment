server:
  port: 8083

spring:
  application:
    name: msa4-lms-v2-payment
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lms_payment}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:112.222.157.156:6301}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

gateway:
  internal:
    base-url: ${GATEWAY_INTERNAL_BASE_URL:http://localhost:8080}

toss:
  payments:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY:}
    client-key: ${TOSS_CLIENT_KEY:}
    connect-timeout: 3000
    read-timeout: 5000

payment:
  refund:
    withdrawal:
      rate-before-start: 1.0
      rate-under-one-third: 0.8333
      rate-under-half: 0.6667
      rate-under-two-thirds: 0.5
      rate-after-two-thirds: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    com.msa4lmsv2payment: debug
